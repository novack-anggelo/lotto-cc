name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to dev is built to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, unit tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon requires JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # One invocation: configure once, and --continue reports every failing check.
      # `test` also covers pure JVM modules (AGP 9 only creates debug unit-test tasks).
      # `compileReleaseKotlin` catches debug-only APIs (e.g. @Preview) used from main.
      - name: Assemble, unit tests & lint
        run: ./gradlew assembleDebug compileReleaseKotlin test lintDebug --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
